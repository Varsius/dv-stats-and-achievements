name: Checks

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}

jobs:
  check-crlf:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          # Important: do not let Git normalize line endings silently
          fetch-depth: 0

      - name: Install unix2dos
        run: apt-get update && apt-get install -y dos2unix

      - name: Convert .cs files to CRLF
        run: |
          find . -type f -name "*.cs" -not -path "./.git/*" -exec unix2dos {} +

      - name: Fail if files changed
        run: |
          if ! git diff --exit-code; then
            echo "Some .cs files are not using CRLF line endings."
            echo "Run this locally:"
            echo 'find . -type f -name "*.cs" -exec unix2dos {} +'
            exit 1
          fi